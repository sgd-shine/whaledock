<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宠物 · 鲸坞 WhaleDock</title>
  <style>
    /* 壳统一动效：任何一张图都能漂浮、摇摆、呼吸、弹跳。 */
    html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
    body { -webkit-user-select:none; user-select:none; cursor:default; }
    #stage { position:absolute; inset:0; display:grid; place-items:center; -webkit-app-region:drag; }
    #sprite {
      max-width:100%; max-height:100%;
      image-rendering:pixelated;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
      transform-origin:50% 85%;
      will-change:transform;
    }
    #sprite.idle { animation:float 3.2s ease-in-out infinite, breathe 3.2s ease-in-out infinite; }
    #sprite.busy { animation:float 1.1s ease-in-out infinite, sway .8s ease-in-out infinite; }
    #sprite.waiting { animation:nudge 1.6s ease-in-out infinite; }
    #sprite.celebrate { animation:hop .6s cubic-bezier(.3,1.4,.5,1) 3; }
    #sprite.error { animation:shake .35s ease-in-out 5; }

    @keyframes float { 0%,100% { translate:0 0; } 50% { translate:0 -7px; } }
    @keyframes breathe { 0%,100% { scale:1 1; } 50% { scale:1.04 .97; } }
    @keyframes sway { 0%,100% { rotate:-3deg; } 50% { rotate:3deg; } }
    @keyframes nudge { 0%,70%,100% { rotate:0deg; } 78% { rotate:-9deg; } 86% { rotate:9deg; } 94% { rotate:-4deg; } }
    @keyframes hop { 0%,100% { translate:0 0; scale:1 1; } 40% { translate:0 -22px; scale:1.08 1.08; } }
    @keyframes shake { 0%,100% { translate:0 0; } 25% { translate:-6px 0; } 75% { translate:6px 0; } }

    @media (prefers-reduced-motion: reduce) {
      #sprite, #sprite.idle, #sprite.busy, #sprite.waiting, #sprite.celebrate, #sprite.error {
        animation:none;
      }
    }

    #hint {
      position:absolute; left:0; right:0; bottom:2px; text-align:center;
      font:11px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
      color:#e6edf7; text-shadow:0 1px 3px #000a; opacity:0; transition:opacity .2s;
      pointer-events:none;
    }
    #stage:hover #hint { opacity:.85; }
  </style>
</head>
<body>
  <div id="stage">
    <img id="sprite" alt="鲸坞桌面宠物" draggable="false">
    <div id="hint">右键菜单</div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
