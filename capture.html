<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>截图与图片 · 鲸坞 WhaleDock</title>
  <style>
    :root { color-scheme: dark; --bg:#09111a; --panel:#101d28; --line:#263b49; --text:#edf6f7; --muted:#91a9b3; --cyan:#6ed5d2; --amber:#f0bd65; --danger:#ff8d84; }
    * { box-sizing: border-box; }
    body { margin:0; min-width:620px; min-height:540px; background:radial-gradient(circle at 80% 0,#153244 0,transparent 36%),var(--bg); color:var(--text); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(900px,100%); margin:0 auto; padding:24px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:18px; }
    h1 { margin:0; font-size:22px; letter-spacing:.02em; }
    .eyebrow { color:var(--cyan); font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
    .workspace { max-width:45%; color:var(--muted); text-align:right; overflow-wrap:anywhere; }
    .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 14px; padding:0; list-style:none; }
    .steps li { border-top:2px solid var(--line); padding-top:7px; color:var(--muted); font-size:12px; }
    .steps li.active { border-color:var(--cyan); color:var(--text); }
    .card { border:1px solid var(--line); border-radius:14px; background:color-mix(in srgb,var(--panel) 94%,transparent); box-shadow:0 18px 60px #0005; overflow:hidden; }
    .dropzone { min-height:250px; display:grid; place-items:center; padding:20px; border-bottom:1px solid var(--line); text-align:center; }
    .dropzone:focus-visible { outline:2px solid var(--cyan); outline-offset:-4px; }
    .empty { max-width:450px; }
    .empty strong { display:block; font-size:17px; margin-bottom:7px; }
    .empty p { margin:0 0 14px; color:var(--muted); }
    #preview { display:none; max-width:100%; max-height:360px; border-radius:8px; box-shadow:0 8px 30px #0008; }
    .meta { display:none; margin-top:10px; color:var(--muted); }
    .body { padding:16px 18px 18px; }
    .status { min-height:22px; margin:0 0 12px; color:var(--muted); }
    .status.error { color:var(--danger); }
    .actions { display:flex; flex-wrap:wrap; gap:9px; justify-content:flex-end; }
    button,select { border:1px solid var(--line); border-radius:9px; background:#142634; color:var(--text); font:inherit; }
    button { min-height:38px; padding:7px 14px; cursor:pointer; }
    button:hover:not(:disabled) { border-color:var(--cyan); }
    button.primary { background:var(--cyan); border-color:var(--cyan); color:#062022; font-weight:700; }
    button.warn { border-color:#715b35; color:var(--amber); }
    button:disabled { opacity:.45; cursor:default; }
    .delivery { display:none; border-top:1px solid var(--line); padding:16px 18px 18px; }
    .delivery h2 { margin:0 0 4px; font-size:16px; }
    .saved { margin:0 0 12px; color:var(--muted); overflow-wrap:anywhere; }
    .review { max-height:170px; margin:10px 0 13px; padding:12px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid var(--line); border-radius:9px; background:#08121a; color:#d8e6e8; user-select:text; }
    .target-row { display:grid; grid-template-columns:auto minmax(180px,1fr); gap:10px; align-items:center; margin-bottom:12px; }
    select { min-height:38px; padding:5px 9px; }
    .privacy { margin:11px 0 0; color:var(--muted); font-size:12px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">本地图片交付</div><h1>截图与图片</h1></div>
      <div class="workspace" id="workspace">当前工作区</div>
    </header>
    <ol class="steps" aria-label="处理步骤">
      <li id="step-input">① 取得图片</li><li id="step-save">② 确认保存</li><li id="step-deliver">③ 确认交付</li>
    </ol>
    <section class="card">
      <div class="dropzone" id="dropzone" tabindex="0" aria-label="拖入或粘贴单张图片">
        <div class="empty" id="empty">
          <strong>拖入一张 PNG / JPEG</strong>
          <p id="instruction">也可粘贴图片，或明确读取当前剪贴板。鲸坞不会持续监听剪贴板。</p>
          <button id="clipboard" type="button">读取剪贴板图片</button>
        </div>
        <img id="preview" alt="待确认图片预览">
        <div class="meta" id="dimensions"></div>
      </div>
      <div class="body">
        <p class="status" id="status" role="status" aria-live="polite">等待图片。</p>
        <div class="actions">
          <button id="cancel" type="button" disabled>取消</button>
          <button class="primary" id="confirm-save" type="button" disabled>第一次确认：保存并处理</button>
        </div>
      </div>
      <section class="delivery" id="delivery" aria-labelledby="delivery-title">
        <h2 id="delivery-title">已保存，请检查完整内容</h2>
        <p class="saved" id="saved"></p>
        <p class="saved" id="route"></p>
        <pre class="review" id="review"></pre>
        <div class="target-row">
          <label for="target">目标会话</label>
          <select id="target"><option value="">自动提交不可用</option></select>
        </div>
        <div class="actions">
          <button id="show-file" type="button">在文件夹中显示</button>
          <button id="save-only" type="button">仅保存</button>
          <button id="copy" type="button">复制确认内容</button>
          <button class="primary" id="send" type="button" disabled>第二次确认：提交到会话</button>
        </div>
        <p class="privacy">仅向你选定的本地 Harness 会话提交已显示文本；结果不确定时不会自动重试。</p>
      </section>
    </section>
  </main>
  <script src="capture.js"></script>
</body>
</html>
