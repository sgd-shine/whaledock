<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鲸坞 WhaleDock</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #111827;
    --text: #e5e7eb;
    --dim: #9ca3af;
    --accent: #6366f1;
    --accent2: #22d3ee;
    --err: #f87171;
    --warn: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #16213e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 24px;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  .drag { position: fixed; inset: 0 0 auto 0; height: 40px; -webkit-app-region: drag; }
  .mark {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(145deg, #1e2a5e 0%, #4f46e5 60%, #3b3fd8 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 30px rgba(79, 70, 229, .35);
  }
  .mark svg { width: 40px; height: 40px; }
  h1 { font-size: 19px; font-weight: 600; letter-spacing: .3px; }
  .tag { font-size: 11px; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; }
  .status { font-size: 14px; color: var(--text); min-height: 20px; text-align: center; }
  .detail { font-size: 12px; color: var(--dim); min-height: 16px; text-align: center; max-width: 420px; }
  .bar {
    width: 300px; height: 3px; border-radius: 2px; overflow: hidden;
    background: rgba(255,255,255,.08); position: relative;
  }
  .bar::after {
    content: ""; position: absolute; top: 0; left: -40%;
    width: 40%; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  .bar.stopped::after { animation: none; background: var(--err); left: 0; width: 100%; }
  .bar.warning::after { animation: none; background: var(--warn); left: 0; width: 100%; }
  #log {
    width: 100%; max-width: 460px; height: 96px;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.07);
    border-radius: 8px; padding: 8px 10px;
    font: 10px/1.5 "SF Mono", Menlo, monospace; color: #7dd3fc;
    overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    -webkit-user-select: text; user-select: text;
  }
  .btns { display: none; gap: 10px; }
  .btns.show { display: flex; }
  button {
    background: var(--panel); color: var(--text);
    border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
    padding: 7px 16px; font-size: 13px; cursor: pointer;
    -webkit-app-region: no-drag;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
  <div class="drag"></div>
  <div class="mark">
    <svg viewBox="0 0 100 100" fill="none">
      <!-- 鲸坞：鲸鱼 + 坞（原创几何设计） -->
      <path d="M76 44 C80 36 86 30 92 27.5 C94.5 26.5 96 29 94.2 31.3 C90.5 36 87.5 40.5 85.5 46 Z" fill="#ffffff"/>
      <path d="M76 46 C80 54 86 60 92 62.5 C94.5 63.5 96 61 94.2 58.7 C90.5 54 87.5 49.5 85.5 44 Z" fill="#ffffff"/>
      <path d="M14 52 C14 36 30 26 48 26 C66 26 78 34 79 45 C78 56 66 66 48 66 C30 66 14 62 14 52 Z" fill="#ffffff"/>
      <circle cx="30" cy="44" r="3.2" fill="#0b0f19"/>
      <path d="M32 14 C32 11 36 11 36 14 L36 19 C36 22 32 22 32 19 Z" fill="#a5f3fc"/>
      <path d="M42 9 C42 6 46 6 46 9 L46 16 C46 19 42 19 42 16 Z" fill="#a5f3fc"/>
      <path d="M20 78 C34 86 66 86 80 78" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
  <h1>鲸坞 WhaleDock</h1>
  <div class="tag">Unofficial · for DeepSeek Harness</div>
  <div class="bar" id="bar"></div>
  <div class="status" id="status">正在启动…</div>
  <div class="detail" id="detail"></div>
  <div id="log"></div>
  <div class="btns" id="btns">
    <button class="primary" onclick="harness.action('retry')">重试</button>
    <button onclick="harness.action('copy-logs')">复制日志</button>
    <button onclick="harness.action('open-logs')">打开日志</button>
    <button onclick="harness.action('quit')">退出</button>
  </div>
  <div class="btns" id="warning-btns">
    <button class="primary" onclick="harness.action('attach-anyway')">仍然接入</button>
    <button onclick="harness.action('open-settings')">打开设置改端口</button>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  window.harness.onStatus((p) => {
    $('status').textContent = p.text || '';
    $('detail').textContent = p.detail || '';
    const isErr = p.phase === 'error';
    const isWarning = p.phase === 'warning';
    $('bar').classList.toggle('stopped', isErr);
    $('bar').classList.toggle('warning', isWarning);
    $('btns').classList.toggle('show', isErr);
    $('warning-btns').classList.toggle('show', isWarning);
    if (isErr) $('status').style.color = 'var(--err)';
    else if (isWarning) $('status').style.color = 'var(--warn)';
    else $('status').style.color = 'var(--text)';
  });
  window.harness.onLog((line) => {
    const el = $('log');
    el.textContent += line + '\n';
    if (el.textContent.length > 20000) el.textContent = el.textContent.slice(-15000);
    el.scrollTop = el.scrollHeight;
  });
</script>
</body>
</html>
