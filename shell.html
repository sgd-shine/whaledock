<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鲸坞 WhaleDock</title>
  <style>
    /* 这一页是鲸坞自己的窗口外壳：经典台保留左栏＋dsh，视频台则在本地现场与
       航道下方的全宽 dsh 对话间切换。主题 token 由主进程注入；源码不写死配色。 */
    :root {
      color-scheme: dark;
      --bg:#090e17; --panel:#101a2c; --line:#1e2a5e;
      --text:#e6edf7; --muted:#93a4bd; --accent:#22d3ee; --primary:#4f46e5;
      --rail:132px;
    }
    * { box-sizing: border-box; }
    html, body { height:100%; }
    body {
      margin:0; background:var(--bg); color:var(--text); overflow:hidden;
      font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
      user-select:none; -webkit-user-select:none;
    }
    /* 经典台左栏；视频驾驶舱启用时整栏隐藏。 */
    #rail {
      position:fixed; left:0; top:0; bottom:0; width:var(--rail);
      display:flex; flex-direction:column; gap:6px; padding:10px 8px;
      background:var(--panel); border-right:1px solid var(--line);
    }
    #switcher-button {
      display:flex; align-items:center; gap:6px; width:100%;
      padding:8px 9px; border:1px solid var(--line); border-radius:9px;
      background:var(--bg); color:var(--text); font:inherit; font-weight:600;
      cursor:pointer; text-align:left; line-height:1.25;
    }
    #switcher-button:hover { border-color:var(--accent); }
    #switcher-button .ship { flex:none; }
    #switcher-button .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #switcher-button .caret { flex:none; color:var(--muted); }
    .workspace-button {
      width:100%; min-width:0; padding:5px 8px; border:1px solid transparent; border-radius:8px;
      background:transparent; color:var(--muted); font:inherit; font-size:10px; cursor:pointer;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left;
    }
    .workspace-button:hover:not(:disabled) { color:var(--text); border-color:var(--line); }
    .workspace-button:disabled { opacity:.55; cursor:default; }
    #actions { display:flex; flex-direction:column; gap:5px; margin-top:4px; overflow-y:auto; }
    #actions button {
      width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:9px;
      background:var(--bg); color:var(--text); font:inherit; cursor:pointer;
      text-align:left; line-height:1.25;
    }
    #actions button:hover:not(:disabled) { border-color:var(--accent); }
    #actions button:disabled { opacity:.45; cursor:default; }
    #rail-foot { margin-top:auto; display:flex; flex-direction:column; gap:5px; }
    #rail-foot button {
      width:100%; padding:7px 9px; border:1px solid transparent; border-radius:9px;
      background:transparent; color:var(--muted); font:inherit; font-size:12px;
      cursor:pointer; text-align:left;
    }
    #rail-foot button:hover { color:var(--text); border-color:var(--line); }
    #action-note {
      font-size:11px; line-height:1.45; color:var(--muted);
      border-top:1px solid var(--line); padding-top:7px; white-space:pre-wrap;
      overflow-wrap:anywhere; max-height:180px; overflow-y:auto;
    }
    #action-note:empty { display:none; }

    /* 弹层统一在左栏右侧展开，不遮住 dsh 的主要内容区。 */
    .layer { position:fixed; inset:0; display:none; z-index:20; }
    .layer.open { display:block; }
    .layer .scrim { position:absolute; inset:0; background:#0009; }
    .panel {
      position:absolute; border:1px solid var(--line); border-radius:12px;
      background:var(--panel); box-shadow:0 24px 70px #000a; padding:12px;
      max-height:calc(100% - 40px); overflow-y:auto;
    }
    #switcher-panel { left:8px; top:52px; width:300px; }
    #switcher-list { display:flex; flex-direction:column; gap:3px; }
    #switcher-list button {
      display:flex; align-items:baseline; gap:8px; width:100%;
      padding:7px 9px; border:1px solid transparent; border-radius:8px;
      background:transparent; color:var(--text); font:inherit; cursor:pointer; text-align:left;
    }
    #switcher-list button:hover { background:var(--bg); border-color:var(--line); }
    #switcher-list button .tick { flex:none; width:14px; color:var(--accent); }
    #switcher-list button .body { flex:1; min-width:0; }
    #switcher-list button .title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #switcher-list button .sub { display:block; color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #switcher-list button .key { flex:none; color:var(--muted); font-size:11px; }
    .broken { color:var(--muted); font-size:12px; padding:6px 9px; overflow-wrap:anywhere; }
    .divider { height:1px; background:var(--line); margin:6px 2px; }
    .panel h2 { margin:0 0 8px; font-size:13px; letter-spacing:.02em; }
    .panel .foot { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
    .panel .foot button {
      padding:7px 14px; border:1px solid var(--line); border-radius:8px;
      background:var(--bg); color:var(--text); font:inherit; cursor:pointer;
    }
    .panel .foot button.primary { border-color:var(--accent); color:var(--accent); }

    /* 引导卡与确认卡都居中，但**不是模态遮罩全屏**——scrim 只吃点击，不弹系统窗。 */
    #onboarding-panel, #confirm-panel { left:50%; top:50%; transform:translate(-50%,-50%); width:min(560px,80vw); }
    #onboarding-body, #confirm-body { display:flex; flex-direction:column; gap:4px; }
    /* onboarding.md 按行 textContent 写入：# 加大加粗、- 成条目，不解析 Markdown、不生成链接。 */
    .ob-h { font-size:15px; font-weight:700; margin-top:10px; }
    .ob-li { padding-left:14px; position:relative; }
    .ob-li::before { content:"·"; position:absolute; left:4px; color:var(--accent); }
    .ob-p { overflow-wrap:anywhere; }
    .ob-diagram {
      margin:5px 0; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
      background:var(--bg); color:var(--accent); font-size:12px; line-height:1.65;
      overflow-wrap:anywhere;
    }
    .ob-blank { height:6px; }

    /* 拖入安装：整窗高亮，只在真的拖进文件时出现。 */
    #drop { position:fixed; inset:0; display:none; z-index:30; align-items:center; justify-content:center; }
    #drop.open { display:flex; }
    #drop .box {
      border:2px dashed var(--accent); border-radius:16px; background:#0b1220e6;
      padding:26px 34px; text-align:center; line-height:1.7;
    }
    #drop .box .big { font-size:17px; font-weight:700; }
    #drop .box .small { color:var(--muted); font-size:12px; }
    #toast {
      position:fixed; left:calc(var(--rail) + 14px); bottom:14px; z-index:40;
      max-width:min(520px,60vw); padding:10px 13px; border:1px solid var(--line);
      border-radius:10px; background:var(--panel); box-shadow:0 14px 40px #0009;
      font-size:12px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; display:none;
    }
    #toast.open { display:block; }

    /* v0.7 视频驾驶舱。只在带 cockpit:"video" 的工作台启用；经典工作台仍用上面的原布局。 */
    #video-cockpit { display:none; position:fixed; inset:0; overflow:hidden; background:var(--bg); }
    body.cockpit-active #rail { display:none; }
    body.cockpit-active #video-cockpit { display:block; }
    body.cockpit-active #toast { left:18px; max-width:min(640px,calc(100vw - 36px)); }
    /* child WebContentsView 会覆盖 y=136 以下的 DOM；对话打开时把瞬时提示压成顶栏内单行，
       避免现场操作的成功/失败消息在切换后被完整对话视图挡住。 */
    body.cockpit-active.chat-open #toast {
      top:98px; bottom:auto; height:30px; padding:5px 10px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    body.chat-open #cockpit-scene { visibility:hidden; pointer-events:none; }
    #enter-cockpit { display:none; }
    body.cockpit-available:not(.cockpit-active) #enter-cockpit { display:block; color:var(--accent); }

    #video-cockpit::before {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:
        radial-gradient(circle at 42% 4%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 34%),
        linear-gradient(115deg, transparent 0 48%, color-mix(in srgb,var(--primary) 7%,transparent) 70%, transparent 100%);
      opacity:.9;
    }
    #cockpit-route {
      position:absolute; left:0; right:0; top:0; height:136px;
      display:grid; grid-template-columns:190px minmax(0,1fr) auto; grid-template-rows:82px 42px;
      align-items:center; column-gap:16px; padding:6px 18px 6px; border-bottom:1px solid var(--line);
      background:color-mix(in srgb,var(--panel) 88%,transparent); backdrop-filter:blur(20px);
    }
    .cockpit-brand { grid-column:1; grid-row:1; display:flex; align-items:center; gap:10px; min-width:0; }
    .cockpit-brand .mark {
      width:38px; height:38px; border:1px solid color-mix(in srgb,var(--accent) 65%,var(--line));
      border-radius:13px; display:grid; place-items:center; color:var(--accent);
      background:color-mix(in srgb,var(--accent) 10%,var(--panel));
      box-shadow:0 0 26px color-mix(in srgb,var(--accent) 11%,transparent);
      font-size:18px;
    }
    .cockpit-brand .eyebrow { display:block; color:var(--muted); font-size:10px; letter-spacing:.18em; }
    .cockpit-brand strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
    #cockpit-workspace { display:block; max-width:142px; padding:2px 0; }
    #route-stages { grid-column:2; grid-row:1; display:flex; align-items:center; min-width:0; overflow-x:auto; scrollbar-width:none; }
    #route-stages::-webkit-scrollbar { display:none; }
    .route-step {
      position:relative; flex:0 0 auto; min-width:68px; border:0; background:transparent; color:var(--muted);
      padding:31px 8px 7px; font:inherit; font-size:11px; cursor:pointer;
    }
    .route-step::before {
      content:""; position:absolute; left:50%; top:13px; width:8px; height:8px; border-radius:50%;
      background:var(--line); border:2px solid var(--panel); box-shadow:0 0 0 1px var(--line);
    }
    .route-step::after {
      content:""; position:absolute; left:calc(50% + 6px); right:calc(-50% + 6px); top:17px; height:1px;
      background:var(--line);
    }
    .route-step:last-child::after { display:none; }
    .route-step:hover, .route-step.active { color:var(--text); }
    .route-step.active::before {
      background:var(--accent);
      box-shadow:0 0 0 1px var(--accent),0 0 16px color-mix(in srgb,var(--accent) 67%,transparent);
    }
    .route-step.blocked { opacity:.62; }
    .route-step.blocked::before { background:#f59e0b; }
    .ghost-button {
      border:1px solid var(--line); border-radius:10px; background:color-mix(in srgb,var(--panel) 75%,transparent);
      color:var(--muted); padding:8px 11px; font:inherit; font-size:11px; cursor:pointer;
    }
    .ghost-button:hover { color:var(--text); border-color:var(--accent); }
    .cockpit-route-actions { grid-column:3; grid-row:1; display:flex; align-items:center; gap:8px; }
    .cockpit-theme-picker {
      height:34px; display:flex; align-items:center; gap:6px; padding:3px 4px 3px 8px;
      border:1px solid var(--line); border-radius:11px;
      background:color-mix(in srgb,var(--panel) 82%,transparent); color:var(--muted);
    }
    .cockpit-theme-picker:focus-within { border-color:var(--accent); }
    #cockpit-theme-swatch {
      flex:none; width:17px; height:17px; border-radius:50%;
      border:1px solid color-mix(in srgb,var(--theme-swatch-text,var(--text)) 38%,transparent);
      background:linear-gradient(135deg,var(--theme-swatch-primary,var(--primary)) 0 50%,var(--theme-swatch-accent,var(--accent)) 50% 100%);
      box-shadow:0 0 10px color-mix(in srgb,var(--theme-swatch-accent,var(--accent)) 24%,transparent);
    }
    .theme-picker-label { white-space:nowrap; font-size:10px; letter-spacing:.04em; }
    #cockpit-theme-select {
      width:104px; min-width:0; border:0; outline:0; background:transparent;
      color:var(--text); font:inherit; font-size:11px; cursor:pointer;
    }
    #cockpit-theme-select:disabled { cursor:not-allowed; opacity:.58; }
    #open-theme-settings {
      width:25px; height:25px; padding:0; border:0; border-radius:7px;
      background:transparent; color:var(--muted); font:inherit; cursor:pointer;
    }
    #open-theme-settings:hover { color:var(--text); background:color-mix(in srgb,var(--accent) 10%,transparent); }
    #cockpit-theme-select:focus-visible, #open-theme-settings:focus-visible,
    .ghost-button:focus-visible, .route-step:focus-visible {
      outline:2px solid var(--accent); outline-offset:2px;
    }
    #toggle-chat { white-space:nowrap; color:var(--text); }
    #toggle-chat[aria-pressed="true"] {
      color:var(--bg); border-color:var(--accent); background:var(--accent); font-weight:700;
      box-shadow:0 0 22px color-mix(in srgb,var(--accent) 20%,transparent);
    }

    #cockpit-scene {
      position:absolute; left:0; right:0; top:136px; bottom:0;
      padding:24px; overflow:auto;
    }
    .scene-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin:0 auto 20px; max-width:1120px; }
    .scene-kicker { color:var(--accent); font-size:10px; letter-spacing:.18em; text-transform:uppercase; }
    .scene-heading h1 { margin:3px 0 0; font-size:clamp(24px,3vw,38px); line-height:1.1; letter-spacing:-.04em; }
    .scene-heading p { margin:0; max-width:330px; color:var(--muted); font-size:12px; text-align:right; }
    #scene-stage { max-width:1120px; margin:0 auto; }
    .scene-hero {
      min-height:310px; border:1px solid color-mix(in srgb,var(--line) 80%,var(--accent)); border-radius:22px;
      background:linear-gradient(150deg,color-mix(in srgb,var(--panel) 88%,transparent),color-mix(in srgb,var(--bg) 94%,transparent));
      box-shadow:0 26px 80px #0005, inset 0 1px #ffffff08; padding:26px;
      display:grid; grid-template-columns:minmax(0,1.2fr) minmax(230px,.8fr); gap:22px;
    }
    .scene-main { display:flex; flex-direction:column; justify-content:space-between; min-width:0; }
    .scene-badge { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; }
    .scene-badge::before {
      content:""; width:7px; height:7px; border-radius:50%; background:var(--accent);
      box-shadow:0 0 12px color-mix(in srgb,var(--accent) 67%,transparent);
    }
    .scene-title { margin:14px 0 8px; font-size:clamp(22px,2.5vw,34px); line-height:1.18; max-width:620px; }
    .scene-copy { color:var(--muted); max-width:560px; margin:0; font-size:13px; }
    .scene-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:24px; }
    .primary-action, .secondary-action {
      border-radius:11px; padding:10px 15px; font:inherit; cursor:pointer;
    }
    .primary-action { border:1px solid var(--accent); color:var(--bg); background:var(--accent); font-weight:700; }
    .secondary-action { border:1px solid var(--line); color:var(--text); background:var(--bg); }
    .scene-side { display:grid; gap:10px; align-content:start; }
    .signal-card {
      border:1px solid var(--line); border-radius:15px; padding:14px;
      background:color-mix(in srgb,var(--bg) 70%,transparent);
    }
    .signal-card .label { color:var(--muted); font-size:10px; letter-spacing:.12em; }
    .signal-card strong { display:block; margin-top:7px; font-size:14px; }
    .signal-card small { display:block; margin-top:4px; color:var(--muted); }
    .scene-stack { display:grid; gap:14px; }
    .scene-hero.compact { min-height:230px; }
    .scene-hero.single { grid-template-columns:1fr; }
    .hero-kicker { color:var(--accent); font-size:10px; letter-spacing:.14em; }
    .scene-copy strong { color:var(--text); }
    .project-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
    .project-card {
      min-width:0; border:1px solid var(--line); border-radius:16px; padding:15px;
      background:color-mix(in srgb,var(--panel) 82%,transparent); color:var(--text);
      text-align:left; font:inherit; box-shadow:inset 0 1px #ffffff07;
    }
    .project-card:hover, .project-card.selected { border-color:var(--accent); transform:translateY(-1px); }
    .project-card-select {
      display:block; width:100%; min-width:0; margin:0; padding:0; border:0;
      background:transparent; color:inherit; text-align:left; font:inherit; cursor:pointer;
    }
    .project-card-select:disabled { cursor:default; }
    .project-card .topline { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:10px; }
    .project-card h3 { margin:9px 0 5px; font-size:15px; line-height:1.35; }
    .project-card p { margin:0; color:var(--muted); font-size:11px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .chip-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .chip {
      border:1px solid var(--line); border-radius:999px; padding:5px 8px;
      color:var(--muted); background:var(--bg); font-size:10px;
    }
    button.chip { cursor:pointer; font:inherit; font-size:10px; }
    button.chip:hover, button.chip[aria-pressed="true"] { color:var(--text); border-color:var(--accent); }
    .empty-cockpit {
      min-height:220px; display:grid; place-items:center; text-align:center; padding:28px;
      border:1px dashed var(--line); border-radius:18px; color:var(--muted);
    }
    .empty-cockpit strong { display:block; color:var(--text); font-size:18px; margin-bottom:7px; }
    .scene-section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:3px 0 8px; }
    .scene-section-head strong { font-size:13px; }
    .scene-section-head span { color:var(--muted); font-size:10px; }
    .inbox-drop {
      min-height:330px; border:1px solid color-mix(in srgb,var(--accent) 52%,var(--line));
      border-radius:22px; padding:22px;
      background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 4%,transparent),transparent 48%),var(--panel);
      display:grid; grid-template-rows:auto 1fr auto; gap:14px;
    }
    .inbox-drop textarea {
      width:100%; min-height:170px; resize:vertical; border:1px solid var(--line); border-radius:15px;
      padding:15px; background:var(--bg); color:var(--text); font:14px/1.7 inherit;
      user-select:text; -webkit-user-select:text; outline:none;
    }
    .inbox-drop textarea:focus {
      border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 9%,transparent);
    }
    .inbox-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .inbox-foot small { color:var(--muted); max-width:480px; }
    .document-stage { display:grid; gap:12px; }
    .document-head {
      position:sticky; top:-24px; z-index:4; display:flex; align-items:center; justify-content:space-between; gap:14px;
      padding:12px 14px; border:1px solid var(--line); border-radius:14px;
      background:color-mix(in srgb,var(--panel) 94%,transparent); backdrop-filter:blur(16px);
    }
    .document-head strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .block-list { display:grid; gap:8px; }
    .document-block {
      border:1px solid var(--line); border-radius:15px; padding:13px 13px 10px;
      background:color-mix(in srgb,var(--panel) 70%,transparent); transition:border-color .16s ease,background .16s ease;
    }
    .document-block.selected { border-color:#fbbf24; background:linear-gradient(135deg,#fbbf240d,transparent),var(--panel); }
    .block-copy { margin:0; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; user-select:text; -webkit-user-select:text; font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .block-meta { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font-size:9px; margin-bottom:8px; }
    .block-toolbar { display:none; flex-wrap:wrap; gap:6px; margin-top:11px; padding-top:9px; border-top:1px solid var(--line); }
    .document-block.selected .block-toolbar { display:flex; }
    .block-toolbar button { border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); padding:6px 9px; font:inherit; font-size:10px; cursor:pointer; }
    .block-toolbar button:hover { border-color:#fbbf24; }
    .proposal-card {
      border:1px solid #fbbf2488; border-radius:18px; padding:16px;
      background:linear-gradient(145deg,#fbbf2412,transparent 40%),var(--panel); box-shadow:0 18px 55px #0006;
    }
    .proposal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .proposal-title { min-width:0; display:grid; gap:4px; }
    .proposal-head .lamp { width:9px; height:9px; border-radius:50%; background:#fbbf24; box-shadow:0 0 14px #fbbf24aa; }
    .compare-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
    .compare-pane { min-width:0; border:1px solid var(--line); border-radius:12px; padding:11px; background:var(--bg); }
    .compare-pane span { color:var(--muted); font-size:9px; letter-spacing:.12em; }
    .compare-pane p { margin:7px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; user-select:text; -webkit-user-select:text; font-size:11px; line-height:1.55; max-height:220px; overflow:auto; }
    .proposal-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .delivery-list { display:grid; gap:7px; margin-top:12px; }
    .delivery-receipt {
      min-width:0; padding:9px 10px; border:1px solid var(--line); border-radius:11px;
      background:color-mix(in srgb,var(--bg) 88%,transparent); font-size:10px;
    }
    .delivery-receipt[data-status="running"] { border-color:color-mix(in srgb,var(--accent) 62%,var(--line)); }
    .delivery-receipt[data-status="completed"] { border-color:#34d39977; }
    .delivery-receipt[data-status="error"], .delivery-receipt[data-status="rejected"] { border-color:#fb718577; }
    .delivery-receipt[data-status="unknown"] { border-color:#fbbf2477; }
    .delivery-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .delivery-status { min-width:0; color:var(--text); font-weight:700; }
    .delivery-target { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
    .delivery-detail { margin:5px 0 0; color:var(--muted); line-height:1.45; }
    .delivery-foot { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-top:7px; }
    .delivery-pulse {
      border-radius:999px; padding:3px 7px; background:color-mix(in srgb,var(--accent) 18%,transparent);
      color:var(--accent); font-weight:700;
    }
    .delivery-result {
      border:1px solid var(--line); border-radius:8px; padding:4px 7px;
      background:var(--panel); color:var(--text); font:inherit; font-size:10px; cursor:pointer;
    }
    .delivery-count { color:var(--muted); }
    .status-strip { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:10px; }
    .status-strip::before {
      content:""; width:7px; height:7px; border-radius:50%; background:var(--accent);
      box-shadow:0 0 12px color-mix(in srgb,var(--accent) 53%,transparent);
    }
    .scan-warning { margin-bottom:12px; color:#fbbf24; }
    .scan-warning::before { background:#fbbf24; box-shadow:0 0 12px #fbbf2488; }
    .publish-lights { display:grid; gap:7px; }
    .publish-light {
      width:100%; display:flex; align-items:center; gap:11px; border:1px solid var(--line); border-radius:12px;
      padding:10px 12px; background:var(--bg); color:var(--text); font:inherit; text-align:left; cursor:pointer;
    }
    .publish-light .lamp { width:12px; height:12px; border-radius:50%; background:#fb7185; box-shadow:0 0 10px #fb718555; }
    .publish-light.on .lamp { background:#34d399; box-shadow:0 0 12px #34d39988; }
    .publish-light:disabled { opacity:.45; cursor:not-allowed; }
    .ai-choice { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:12px 0; }
    .ai-choice button { border:1px solid var(--line); border-radius:10px; padding:9px; background:var(--bg); color:var(--muted); font:inherit; font-size:10px; cursor:pointer; }
    .ai-choice button[aria-pressed="true"] { border-color:var(--accent); color:var(--text); }
    .tactic-wall { display:flex; flex-wrap:wrap; gap:8px; align-content:start; min-height:180px; }
    .tactic-chip { max-width:260px; border:1px solid var(--line); border-radius:999px; padding:9px 13px; background:var(--panel); color:var(--text); }
    .data-door { min-height:330px; display:grid; place-items:center; text-align:center; border:1px solid #fb718555; border-radius:22px; background:radial-gradient(circle,#fb71850b,transparent 55%),var(--panel); }
    .data-door .door-lamp { width:18px; height:18px; margin:0 auto 14px; border-radius:50%; background:#fb7185; box-shadow:0 0 24px #fb718588; }
    .data-door h2 { margin:0; font-size:26px; }
    .data-door p { margin:8px auto 0; max-width:480px; color:var(--muted); }

    #cockpit-task-flow {
      grid-column:1 / -1; grid-row:2; min-width:0; height:38px; display:grid;
      grid-template-columns:auto auto minmax(0,1fr); align-items:center; gap:12px;
      padding:0 10px; border:1px solid var(--line); border-radius:12px;
      background:color-mix(in srgb,var(--bg) 76%,transparent); overflow:hidden;
    }
    .panel-title { display:flex; align-items:center; gap:9px; white-space:nowrap; }
    .panel-title strong { font-size:11px; letter-spacing:.04em; }
    #task-state { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:10px; }
    #task-state .lamp { width:8px; height:8px; border-radius:50%; background:var(--muted); }
    #task-state[data-state="busy"] .lamp {
      background:var(--accent);
      box-shadow:0 0 14px color-mix(in srgb,var(--accent) 67%,transparent);
      animation:pulse 1.3s ease-in-out infinite;
    }
    #task-state[data-state="waiting"] .lamp { background:#f59e0b; box-shadow:0 0 12px #f59e0b88; }
    #task-state[data-state="celebrate"] .lamp { background:#34d399; }
    #task-state[data-state="error"] .lamp, #task-state[data-state="offline"] .lamp { background:#fb7185; }
    @keyframes pulse { 50% { opacity:.42; transform:scale(.82); } }
    .task-counts { display:flex; align-items:center; gap:5px; }
    .task-count { display:flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px; padding:4px 8px; background:var(--panel); }
    .task-count span { color:var(--muted); font-size:9px; }
    .task-count strong { font-size:11px; font-variant-numeric:tabular-nums; }
    #task-recent { min-width:0; display:flex; justify-content:flex-end; gap:6px; overflow:hidden; }
    .task-chip { flex:0 1 auto; min-width:0; border:1px solid var(--line); border-radius:999px; color:var(--muted); padding:5px 8px; font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    @media (max-width:1080px) {
      #cockpit-route { grid-template-columns:150px minmax(0,1fr) auto; column-gap:8px; padding-inline:12px; }
      .route-step { min-width:58px; }
      #cockpit-scene { padding:18px; }
      .scene-hero { grid-template-columns:1fr; }
      .scene-side { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .compare-grid { grid-template-columns:1fr; }
      .cockpit-brand .eyebrow { display:none; }
      .theme-picker-label { display:none; }
      #cockpit-theme-select { width:94px; }
      #task-recent .task-chip:nth-child(n+2) { display:none; }
    }
    @media (prefers-reduced-motion:reduce) { #task-state .lamp { animation:none !important; } }
  </style>
</head>
<body>
  <div id="rail">
    <button id="switcher-button" type="button" title="切换工作台">
      <span class="ship">🚢</span><span class="name" id="switcher-name">默认工作台</span><span class="caret">▾</span>
    </button>
    <button id="rail-workspace" class="workspace-button" type="button">工作区：当前工作区</button>
    <div id="actions"></div>
    <div id="action-note"></div>
    <div id="rail-foot">
      <button id="enter-cockpit" type="button">◉ 返回视频驾驶舱</button>
      <button id="open-workspace" type="button">📁 打开工作区</button>
      <button id="open-settings" type="button">⚙ 设置…</button>
    </div>
  </div>

  <section id="video-cockpit" aria-label="视频创作驾驶舱">
    <header id="cockpit-route">
      <div class="cockpit-brand">
        <div class="mark" aria-hidden="true">◉</div>
        <div><span class="eyebrow">WHALEDOCK COCKPIT</span><strong id="cockpit-name">短视频创作台</strong><button id="cockpit-workspace" class="workspace-button" type="button">工作区：当前工作区</button></div>
      </div>
      <nav id="route-stages" aria-label="一条视频的航道"></nav>
      <div class="cockpit-route-actions">
        <div class="cockpit-theme-picker" id="cockpit-theme-picker" title="鲸坞全局色系；不改变 Harness 对话页">
          <span id="cockpit-theme-swatch" aria-hidden="true"></span>
          <label class="theme-picker-label" for="cockpit-theme-select">鲸坞色系</label>
          <select id="cockpit-theme-select" aria-label="鲸坞全局色系"></select>
          <button id="open-theme-settings" type="button" aria-label="自定义鲸坞色系" title="打开设置，自定义主题文件">＋</button>
        </div>
        <button class="ghost-button" id="toggle-chat" type="button" aria-pressed="false">对话 ⌘K</button>
        <button class="ghost-button" id="exit-cockpit" type="button">退出驾驶舱</button>
      </div>
      <section id="cockpit-task-flow" aria-label="鲸坞任务流">
        <div class="panel-title"><strong>鲸坞任务流</strong><div id="task-state" data-state="offline"><span class="lamp"></span><span id="task-state-label">正在接线</span></div></div>
        <div class="task-counts">
          <div class="task-count"><span>进行中</span><strong id="task-active">—</strong></div>
          <div class="task-count"><span>等确认</span><strong id="task-waiting">—</strong></div>
          <div class="task-count"><span>已完成</span><strong id="task-completed">—</strong></div>
        </div>
        <div id="task-recent" aria-label="最近任务"></div>
      </section>
    </header>

    <main id="cockpit-scene">
      <div class="scene-heading">
        <div><div class="scene-kicker" id="scene-kicker">TODAY · 今天</div><h1 id="scene-heading">今天，推进一件事</h1></div>
        <p id="scene-summary">现场跟着文件走；没有证据的位置保持留白。</p>
      </div>
      <div id="scene-stage">
        <div class="empty-cockpit" aria-live="polite"><div><strong>正在读取工作区</strong><span>只投影本地 Markdown 事实。</span></div></div>
      </div>
    </main>

  </section>

  <div class="layer" id="switcher-layer">
    <div class="scrim" data-close="switcher"></div>
    <div class="panel" id="switcher-panel">
      <div id="switcher-list"></div>
      <div class="divider"></div>
      <div id="switcher-broken"></div>
      <div class="foot">
        <button type="button" id="manage-workbenches">管理工作台…</button>
      </div>
    </div>
  </div>

  <div class="layer" id="onboarding-layer">
    <div class="scrim" data-close="onboarding"></div>
    <div class="panel" id="onboarding-panel">
      <div id="onboarding-body"></div>
      <div class="foot"><button type="button" class="primary" data-close="onboarding">知道了</button></div>
    </div>
  </div>

  <div class="layer" id="confirm-layer">
    <div class="scrim" data-close="confirm"></div>
    <div class="panel" id="confirm-panel">
      <h2 id="confirm-title">请确认</h2>
      <div id="confirm-body"></div>
      <div class="foot">
        <button type="button" id="confirm-cancel" data-close="confirm">取消</button>
        <button type="button" class="primary" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <div id="drop">
    <div class="box">
      <div class="big">松手即安装这个工作台</div>
      <div class="small">只把文件夹复制一份进来，不会运行它、不解压、不联网</div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="shell.js"></script>
</body>
</html>
