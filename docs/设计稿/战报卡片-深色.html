<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1440px; overflow:hidden; }
body { font-family:"Noto Sans CJK SC","PingFang SC",sans-serif; color:#e5e7eb;
  background:radial-gradient(1400px 800px at 18% -8%, #16213e 0%, #0b0f19 58%);

.done { margin-top:110px; display:flex; align-items:center; gap:26px; }
.check { width:76px; height:76px; border-radius:50%; background:linear-gradient(145deg,#22d3ee,#4f46e5);

.grid { margin-top:96px; display:grid; grid-template-columns:1fr 1fr; gap:34px; }
.cell { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);

.cell .k { font-size:28px; color:#9ca3af; letter-spacing:2px; }
.cell .v { font-size:58px; font-weight:800; margin-top:14px; }
.cell .v small { font-size:30px; font-weight:500; color:#9ca3af; margin-left:8px; }
.cyan { color:#22d3ee; } .indigo { color:#a5b4fc; }
.wave { position:absolute; left:0; right:0; bottom:196px; height:120px; opacity:.5; }
.footer { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; position:relative; z-index:2; }
.slogan { font-size:30px; color:#9ca3af; }
.slogan b { color:#e5e7eb; font-weight:600; }
.meta { text-align:right; font-size:26px; color:#6b7280; line-height:1.8; }
