# 推送 SemVer tag 后构建 macOS/Windows 全部产物；公开 Release 另受绑定产物哈希的审批门控。
# macOS 产物一律由 scripts/macos-codesign.js 打签名；本地脚本仍可默认 ad-hoc，
# 但 tag 发布必须具备完整 Developer ID + Hardened Runtime + 公证凭据，否则 fail-closed。
# 不签名的 .app 下载后会被 Apple Silicon 判为「已损坏」，因此签名与校验是发布硬门。
# v0.11.0-alpha.1 构建为同名包内版本，并由 Release 标记为 prerelease。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify pinned Node and npm toolchain
        run: node -e "const cp=require('child_process');const npm=cp.spawnSync(process.platform==='win32'?'npm.cmd':'npm',['--version'],{encoding:'utf8',shell:process.platform==='win32'});if(process.version!=='v22.23.2'||npm.status!==0||npm.stdout.trim()!=='10.9.8')throw new Error('Expected Node v22.23.2 / npm 10.9.8, got '+process.version+' / '+npm.stdout.trim())"

      - name: Verify tag matches committed package and lock versions
        run: |
          node -e "const tag=process.env.GITHUB_REF_NAME||'';const expected=tag.startsWith('v')?tag.slice(1):'';const p=require('./package.json'),l=require('./package-lock.json');if(!expected||p.version!==expected||l.version!==expected||!l.packages||!l.packages['']||l.packages[''].version!==expected)throw new Error('Release tag/package/lock version mismatch: '+tag+' / '+p.version+' / '+l.version+' / '+(l.packages&&l.packages['']&&l.packages[''].version))"

      - name: Verify annotated tag is reachable from main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "::error title=Annotated release tag required::$GITHUB_REF_NAME is not an annotated tag"
            exit 1
          fi
          tag_commit="$(git rev-parse "$GITHUB_REF^{}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]] || ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error title=Release tag is outside main::$GITHUB_REF_NAME must resolve to the checked-out commit and be reachable from origin/main"
            exit 1
          fi
          echo "RELEASE_TAG_MAIN_ANCESTOR_VERIFIED tag=$GITHUB_REF_NAME commit=$tag_commit"

      - name: Verify macOS release credentials are present
        env:
          MACOS_SIGN_CERTIFICATE: ${{ secrets.MACOS_SIGN_CERTIFICATE }}
          MACOS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGN_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          required=(
            MACOS_SIGN_CERTIFICATE
            MACOS_SIGN_CERTIFICATE_PASSWORD
            MACOS_SIGN_IDENTITY
            MACOS_NOTARY_KEY
            MACOS_NOTARY_KEY_ID
            MACOS_NOTARY_ISSUER_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=macOS release credentials missing::Required signing or notarization secret is incomplete"
              exit 1
            fi
          done
          echo "MACOS_RELEASE_CREDENTIALS_PRESENT"

      - name: Install dependencies
        run: npm ci

      - name: Verify committed compliance materials
        run: npm run compliance:verify

      - name: Verify committed app runtime compliance materials
        run: npm run app-runtime:verify

      - name: Verify reproducible dsh UI forks
        run: npm run refork:dsh -- --check

      - name: Import required Developer ID certificate
        id: mac-cert
        env:
          MACOS_SIGN_CERTIFICATE: ${{ secrets.MACOS_SIGN_CERTIFICATE }}
          MACOS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGN_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        shell: bash
        run: |
          if [[ -z "${MACOS_SIGN_CERTIFICATE:-}" || -z "${MACOS_SIGN_CERTIFICATE_PASSWORD:-}" || -z "${MACOS_SIGN_IDENTITY:-}" ]]; then
            echo "::error title=Developer ID missing::Tagged macOS releases require the complete signing credential set"
            exit 1
          fi
          keychain="$RUNNER_TEMP/whaledock-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_SIGN_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_SIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "identity=present" >> "$GITHUB_OUTPUT"
          echo "WHALEDOCK_MAC_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_SIGN_MODE=developer-id" >> "$GITHUB_ENV"

      - name: Smoke test (no GUI)
        run: npm run smoke

      - name: Bundle dsh for macOS arm64
        run: npm run bundle:dsh -- --platform=darwin --arch=arm64

      - name: Verify macOS arm64 third-party inventory
        run: node scripts/third-party-inventory.js verify --runtime=vendor/dsh-runtime --inventory=compliance/inventory-darwin-arm64.json

      - name: Build macOS arm64 DMG and ZIP
        # runtime 已在上一步按 inventory 核验；这里直接打包，避免 predist 再生成一次后绕过核验。
        run: npx --no-install electron-builder --config electron-builder.v0.11-alpha.1.cjs --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged macOS arm64 compliance materials
        run: |
          node scripts/context-poc-manifest.js --resources=release/.app-archives.noindex/WhaleDock-arm64.app-bundle/Contents/Resources
          node scripts/verify-packaged-compliance.js --search=release --minimum=1

      - name: Verify macOS arm64 app runtime in archive, ZIP, and DMG
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/verify-packaged-compliance.js --search=release/.app-archives.noindex/WhaleDock-arm64.app-bundle/Contents/Resources --minimum=1
          node scripts/verify-packaged-app-runtime.js --app=release/.app-archives.noindex/WhaleDock-arm64.app-bundle
          workdir="$(mktemp -d "$RUNNER_TEMP/whaledock-app-runtime-arm64.XXXXXX")"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/whaledock-app-runtime-arm64-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$workdir"
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ditto -x -k "release/WhaleDock-${version}-arm64-mac.zip" "$workdir"
          app="$(find "$workdir" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          node scripts/context-poc-manifest.js --resources="$app/Contents/Resources"
          node scripts/verify-packaged-compliance.js --search="$app/Contents/Resources" --minimum=1
          node scripts/verify-packaged-app-runtime.js --app="$app"
          hdiutil attach "release/WhaleDock-${version}-arm64.dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          node scripts/context-poc-manifest.js --resources="$mount_dir/WhaleDock.app/Contents/Resources"
          node scripts/verify-packaged-compliance.js --search="$mount_dir/WhaleDock.app/Contents/Resources" --minimum=1
          node scripts/verify-packaged-app-runtime.js --app="$mount_dir/WhaleDock.app"
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
          rm -rf "$workdir"
          trap - EXIT

      - name: Verify macOS arm64 artifact signature
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          workdir="$RUNNER_TEMP/verify-arm64"
          rm -rf "$workdir"; mkdir -p "$workdir"
          ditto -x -k "release/WhaleDock-${version}-arm64-mac.zip" "$workdir"
          node scripts/macos-codesign.js verify-dir "$workdir"
          app="$(find "$workdir" -maxdepth 2 -name '*.app' -print -quit)"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | sed -n '1,12p'
          # Gatekeeper assessment must wait until the later notarization step.
          # A correctly signed but not-yet-notarized Developer ID app is expected to be rejected here.
          rm -rf "$workdir"

      - name: Bundle dsh for macOS x64
        run: npm run bundle:dsh -- --platform=darwin --arch=x64

      - name: Verify macOS x64 third-party inventory
        run: node scripts/third-party-inventory.js verify --runtime=vendor/dsh-runtime --inventory=compliance/inventory-darwin-x64.json

      - name: Build macOS x64 DMG and ZIP
        # 同上，确保进入产物的就是刚核验过的 x64 runtime。
        run: npx --no-install electron-builder --config electron-builder.v0.11-alpha.1.cjs --mac dmg zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged macOS compliance materials
        run: |
          node scripts/context-poc-manifest.js --resources=release/.app-archives.noindex/WhaleDock-x64.app-bundle/Contents/Resources
          node scripts/verify-packaged-compliance.js --search=release --minimum=2

      - name: Verify macOS x64 app runtime in archive, ZIP, and DMG
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/verify-packaged-compliance.js --search=release/.app-archives.noindex/WhaleDock-x64.app-bundle/Contents/Resources --minimum=1
          node scripts/verify-packaged-app-runtime.js --app=release/.app-archives.noindex/WhaleDock-x64.app-bundle
          workdir="$(mktemp -d "$RUNNER_TEMP/whaledock-app-runtime-x64.XXXXXX")"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/whaledock-app-runtime-x64-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$workdir"
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ditto -x -k "release/WhaleDock-${version}-x64-mac.zip" "$workdir"
          app="$(find "$workdir" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$app"
          node scripts/context-poc-manifest.js --resources="$app/Contents/Resources"
          node scripts/verify-packaged-compliance.js --search="$app/Contents/Resources" --minimum=1
          node scripts/verify-packaged-app-runtime.js --app="$app"
          hdiutil attach "release/WhaleDock-${version}-x64.dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          node scripts/context-poc-manifest.js --resources="$mount_dir/WhaleDock.app/Contents/Resources"
          node scripts/verify-packaged-compliance.js --search="$mount_dir/WhaleDock.app/Contents/Resources" --minimum=1
          node scripts/verify-packaged-app-runtime.js --app="$mount_dir/WhaleDock.app"
          hdiutil detach "$mount_dir"
          rmdir "$mount_dir"
          rm -rf "$workdir"
          trap - EXIT

      - name: Verify macOS x64 artifact signature
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          workdir="$RUNNER_TEMP/verify-x64"
          rm -rf "$workdir"; mkdir -p "$workdir"
          ditto -x -k "release/WhaleDock-${version}-x64-mac.zip" "$workdir"
          node scripts/macos-codesign.js verify-dir "$workdir"
          app="$(find "$workdir" -maxdepth 2 -name '*.app' -print -quit)"
          codesign --verify --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | sed -n '1,12p'
          # Gatekeeper assessment must wait until the later notarization step.
          # A correctly signed but not-yet-notarized Developer ID app is expected to be rejected here.
          rm -rf "$workdir"

      # 提交与等待分步，确保 Apple 长时间排队时已签名成品和 submission id 会先作为
      # 私有 Actions artifact 保留下来；正式 tag 不允许跳过公证。
      - name: Submit macOS artifacts for notarization
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          if [[ "${MACOS_SIGN_MODE:-}" != "developer-id" ]]; then
            echo "::error title=Developer ID required::Tagged macOS releases cannot skip notarization"
            exit 1
          fi
          if [[ -z "${MACOS_NOTARY_KEY:-}" || -z "${MACOS_NOTARY_KEY_ID:-}" || -z "${MACOS_NOTARY_ISSUER_ID:-}" ]]; then
            echo "::error title=Notarization missing::已用 Developer ID 签名但未配置公证密钥"
            exit 1
          fi
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$key"
          version="$(node -p "require('./package.json').version")"
          assets=(
            "release/WhaleDock-${version}-arm64.dmg" \
            "release/WhaleDock-${version}-x64.dmg" \
            "release/WhaleDock-${version}-arm64-mac.zip" \
            "release/WhaleDock-${version}-x64-mac.zip"
          )
          notary_dir="$RUNNER_TEMP/whaledock-notary"
          submissions="release/notary-submissions.tsv"
          mkdir -p "$notary_dir"
          rm -f "$submissions"
          trap 'rm -f "$key"; rm -rf "$notary_dir"' EXIT

          # Apple 偶尔会让单个提交排队超过 45 分钟。先上传全部成品，再并行等待，
          # 避免四个串行 --wait 把正常的 In Progress 误判为发布失败。
          index=0
          for asset in "${assets[@]}"; do
            index=$((index + 1))
            submit_json="$notary_dir/submit-${index}.json"
            xcrun notarytool submit "$asset" \
              --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" \
              --no-wait --output-format json > "$submit_json"
            submission_id="$(node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!data.id) throw new Error("notarytool submit did not return an id");
              process.stdout.write(data.id);
            ' "$submit_json")"
            printf '%s\t%s\t%s\n' "$index" "$asset" "$submission_id" >> "$submissions"
            echo "NOTARY_SUBMITTED asset=$(basename "$asset") id=$submission_id"
          done

          trap - EXIT
          rm -f "$key"
          rm -rf "$notary_dir"

      - name: Preserve signed macOS assets and notarization state
        if: steps.mac-cert.outputs.identity == 'present'
        uses: actions/upload-artifact@v4
        with:
          name: whaledock-mac-pending-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/WhaleDock-*.dmg
            release/WhaleDock-*-mac.zip
            release/notary-submissions.tsv

      # 公证必须在算校验和之前完成，因为 stapler 会改写 dmg 字节。
      # 本步若遇 Apple 长队列失败，上一私有 artifact 可由 Resume Notarization 原样续跑。
      - name: Wait for notarization and staple macOS artifacts
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          if [[ "${MACOS_SIGN_MODE:-}" != "developer-id" ]]; then
            echo "::error title=Developer ID required::Tagged macOS releases cannot skip notarization"
            exit 1
          fi
          if [[ -z "${MACOS_NOTARY_KEY:-}" || -z "${MACOS_NOTARY_KEY_ID:-}" || -z "${MACOS_NOTARY_ISSUER_ID:-}" ]]; then
            echo "::error title=Notarization missing::已用 Developer ID 签名但未配置公证密钥"
            exit 1
          fi
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$key"
          version="$(node -p "require('./package.json').version")"
          assets=(
            "release/WhaleDock-${version}-arm64.dmg" \
            "release/WhaleDock-${version}-x64.dmg" \
            "release/WhaleDock-${version}-arm64-mac.zip" \
            "release/WhaleDock-${version}-x64-mac.zip"
          )
          notary_dir="$RUNNER_TEMP/whaledock-notary"
          submissions="release/notary-submissions.tsv"
          mkdir -p "$notary_dir"
          test -s "$submissions"
          trap 'rm -f "$key"; rm -rf "$notary_dir"' EXIT

          pids=()
          while IFS=$'\t' read -r submission_index asset submission_id; do
            (
              notary_status() {
                node -e '
                  const fs = require("fs");
                  const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  process.stdout.write(data.status || "");
                ' "$1"
              }
              notary_deadline_epoch=$(( $(date +%s) + 1200 ))
              notary_attempt=0
              notary_accepted=0
              while [[ "$(date +%s)" -lt "$notary_deadline_epoch" ]]; do
                notary_attempt=$((notary_attempt + 1))
                wait_json="$notary_dir/wait-${submission_index}-${notary_attempt}.json"
                if xcrun notarytool wait "$submission_id" \
                  --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" \
                  --timeout 10m --output-format json > "$wait_json"; then
                  status="$(notary_status "$wait_json")"
                  if [[ "$status" == "Accepted" ]]; then
                    notary_accepted=1
                    break
                  fi
                  echo "::error title=Notarization rejected::$(basename "$asset") status=${status:-unknown} id=$submission_id"
                  exit 1
                else
                  wait_rc=$?
                fi

                # notarytool 有时会在 Apple 仍处理时因单次 HTTP -1001 超时退出。
                # 查询同一 submission id：已接受则结束，明确拒绝则失败，否则续查而不重传。
                info_json="$notary_dir/info-${submission_index}-${notary_attempt}.json"
                if xcrun notarytool info "$submission_id" \
                  --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" \
                  --output-format json > "$info_json"; then
                  status="$(notary_status "$info_json")"
                  case "$status" in
                    Accepted) notary_accepted=1; break ;;
                    "In Progress") ;;
                    *)
                      echo "::error title=Notarization rejected::$(basename "$asset") status=${status:-unknown} id=$submission_id"
                      exit 1
                      ;;
                  esac
                fi
                echo "::warning title=Notarization retry::$(basename "$asset") id=$submission_id wait_rc=$wait_rc attempt=$notary_attempt"
                sleep 15
              done
              if [[ "$notary_accepted" -ne 1 ]]; then
                echo "::error title=Notarization deadline exceeded::$(basename "$asset") id=$submission_id"
                exit 1
              fi
              echo "NOTARY_ACCEPTED asset=$(basename "$asset") id=$submission_id"
            ) &
            pids+=("$!")
          done < "$submissions"

          wait_failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then wait_failed=1; fi
          done
          if [[ "$wait_failed" -ne 0 ]]; then
            echo "::error title=Notarization failed::至少一个 macOS 成品未通过 Apple 公证"
            exit 1
          fi

          # zip 不能 staple；ticket 由 Gatekeeper 联网校验。dmg 一律 staple 成离线可验。
          for asset in "${assets[@]}"; do
            case "$asset" in
              *.dmg)
                xcrun stapler staple "$asset"
                xcrun stapler validate "$asset"
                mount_dir="$(mktemp -d "$RUNNER_TEMP/whaledock-gatekeeper.XXXXXX")"
                hdiutil attach "$asset" -nobrowse -readonly -mountpoint "$mount_dir"
                if ! codesign --verify --deep --strict --verbose=2 "$mount_dir/WhaleDock.app" || \
                   ! spctl --assess --type execute --verbose=2 "$mount_dir/WhaleDock.app"; then
                  hdiutil detach "$mount_dir" || true
                  rmdir "$mount_dir" || true
                  exit 1
                fi
                node scripts/verify-packaged-compliance.js --search="$mount_dir/WhaleDock.app/Contents/Resources" --minimum=1
                node scripts/verify-packaged-app-runtime.js --app="$mount_dir/WhaleDock.app"
                hdiutil detach "$mount_dir"
                rmdir "$mount_dir"
                ;;
            esac
          done

          trap - EXIT
          rm -f "$key"
          rm -rf "$notary_dir"

      - name: Verify macOS artifact names and write checksums
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          cd release
          assets=(
            "WhaleDock-${version}-arm64.dmg"
            "WhaleDock-${version}-arm64-mac.zip"
            "WhaleDock-${version}-x64.dmg"
            "WhaleDock-${version}-x64-mac.zip"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          shasum -a 256 "${assets[@]}" > SHA256SUMS-mac.txt
          node - "${assets[@]}" <<'NODE'
          const fs = require('fs');
          const update = require('../lib/update');
          const sums = fs.readFileSync('SHA256SUMS-mac.txt', 'utf8');
          for (const asset of process.argv.slice(2)) update.checksumForAsset(sums, asset);
          NODE

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: whaledock-mac-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/WhaleDock-*.dmg
            release/WhaleDock-*-mac.zip
            release/SHA256SUMS-mac.txt

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify pinned Node and npm toolchain
        run: node -e "const cp=require('child_process');const npm=cp.spawnSync(process.platform==='win32'?'npm.cmd':'npm',['--version'],{encoding:'utf8',shell:process.platform==='win32'});if(process.version!=='v22.23.2'||npm.status!==0||npm.stdout.trim()!=='10.9.8')throw new Error('Expected Node v22.23.2 / npm 10.9.8, got '+process.version+' / '+npm.stdout.trim())"

      - name: Verify tag matches committed package and lock versions
        run: |
          node -e "const tag=process.env.GITHUB_REF_NAME||'';const expected=tag.startsWith('v')?tag.slice(1):'';const p=require('./package.json'),l=require('./package-lock.json');if(!expected||p.version!==expected||l.version!==expected||!l.packages||!l.packages['']||l.packages[''].version!==expected)throw new Error('Release tag/package/lock version mismatch: '+tag+' / '+p.version+' / '+l.version+' / '+(l.packages&&l.packages['']&&l.packages[''].version))"

      - name: Verify annotated tag is reachable from main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "::error title=Annotated release tag required::$GITHUB_REF_NAME is not an annotated tag"
            exit 1
          fi
          tag_commit="$(git rev-parse "$GITHUB_REF^{}")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]] || ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error title=Release tag is outside main::$GITHUB_REF_NAME must resolve to the checked-out commit and be reachable from origin/main"
            exit 1
          fi
          echo "RELEASE_TAG_MAIN_ANCESTOR_VERIFIED tag=$GITHUB_REF_NAME commit=$tag_commit"

      - name: Install dependencies
        run: npm ci

      - name: Verify committed compliance materials
        run: npm run compliance:verify

      - name: Verify committed app runtime compliance materials
        run: npm run app-runtime:verify

      - name: Verify reproducible dsh UI forks
        run: npm run refork:dsh -- --check

      - name: Smoke test (no GUI)
        run: npm run smoke

      - name: Bundle dsh for Windows x64
        run: npm run bundle:dsh -- --platform=win32 --arch=x64

      - name: Verify Windows x64 third-party inventory
        run: node scripts/third-party-inventory.js verify --runtime=vendor/dsh-runtime --inventory=compliance/inventory-win32-x64.json

      - name: Build Windows installer and portable executable
        # runtime 已按 Windows inventory 核验，禁止 predist 重建后绕过材料门。
        run: npx --no-install electron-builder --config electron-builder.v0.11-alpha.1.cjs --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged Windows compliance materials
        shell: pwsh
        run: |
          node scripts/context-poc-manifest.js --resources=release/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { throw "win-unpacked context-poc trust-root verification failed" }
          node scripts/verify-packaged-compliance.js --search=release --minimum=1
          if ($LASTEXITCODE -ne 0) { throw "win-unpacked dsh compliance verification failed" }

      - name: Verify Windows app runtime in unpacked, Setup, and portable artifacts
        shell: pwsh
        run: |
          node scripts/verify-packaged-compliance.js --search=release/win-unpacked/resources --minimum=1
          if ($LASTEXITCODE -ne 0) { throw "win-unpacked dsh compliance verification failed" }
          node scripts/verify-packaged-app-runtime.js --app=release/win-unpacked
          if ($LASTEXITCODE -ne 0) { throw "win-unpacked app runtime verification failed" }
          $version = node -p "require('./package.json').version"
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          $assets = @(
            "release/WhaleDock-Setup-$version.exe",
            "release/WhaleDock-$version-portable.exe"
          )
          $index = 0
          foreach ($asset in $assets) {
            $index += 1
            $outer = Join-Path $env:RUNNER_TEMP "whaledock-app-runtime-outer-$index"
            $app = Join-Path $env:RUNNER_TEMP "whaledock-app-runtime-app-$index"
            New-Item -ItemType Directory -Force -Path $outer, $app | Out-Null
            & $sevenZip x -y "-o$outer" $asset | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract $asset" }
            $inner = @(Get-ChildItem -LiteralPath $outer -Recurse -File -Filter 'app-*.7z')
            if ($inner.Count -ne 1) { throw "Expected one app-*.7z in $asset, got $($inner.Count)" }
            & $sevenZip x -y "-o$app" $inner[0].FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to extract $($inner[0].FullName)" }
            $resources = Join-Path $app 'resources'
            node scripts/context-poc-manifest.js "--resources=$resources"
            if ($LASTEXITCODE -ne 0) { throw "context-poc trust-root verification failed for $asset" }
            node scripts/verify-packaged-compliance.js "--search=$app/resources" --minimum=1
            if ($LASTEXITCODE -ne 0) { throw "dsh compliance verification failed for $asset" }
            node scripts/verify-packaged-app-runtime.js "--app=$app"
            if ($LASTEXITCODE -ne 0) { throw "App runtime verification failed for $asset" }
            Remove-Item -LiteralPath $outer, $app -Recurse -Force
          }

      - name: Verify Windows artifact names and write checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "WhaleDock-Setup-$version.exe",
            "WhaleDock-$version-portable.exe"
          )
          Push-Location release
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $lines | Set-Content -LiteralPath SHA256SUMS-win.txt -Encoding ascii
          node -e "const fs=require('fs');const update=require('../lib/update');const sums=fs.readFileSync('SHA256SUMS-win.txt','utf8');for(const asset of process.argv.slice(1))update.checksumForAsset(sums,asset)" @assets
          if ($LASTEXITCODE -ne 0) {
            throw "Update checksum contract validation failed"
          }
          Pop-Location

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: whaledock-win-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/WhaleDock-Setup-*.exe
            release/WhaleDock-*-portable.exe
            release/SHA256SUMS-win.txt

  publish-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download finalized macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: whaledock-mac-${{ github.ref_name }}
          path: release-assets

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: whaledock-win-${{ github.ref_name }}
          path: release-assets

      - name: Verify release set and enforce public release approval
        shell: bash
        env:
          WHALEDOCK_BUNDLED_COMPLIANCE_APPROVAL: ${{ vars.WHALEDOCK_BUNDLED_COMPLIANCE_APPROVAL }}
        run: |
          cd release-assets
          sed 's/\r$//' SHA256SUMS-mac.txt SHA256SUMS-win.txt |
            sed '/^[[:space:]]*$/d' |
            LC_ALL=C sort > SHA256SUMS-all.txt
          sha256sum --check SHA256SUMS-all.txt

          release_set_sha="$(sha256sum SHA256SUMS-all.txt | awk '{print $1}')"
          expected="release:${GITHUB_REF_NAME}:sha256:${release_set_sha}"
          if [[ "${WHALEDOCK_BUNDLED_COMPLIANCE_APPROVAL:-}" != "$expected" ]]; then
            {
              echo "## 公开 Release 已被审批门阻止"
              echo
              echo "构建产物已保留在本次 Actions run，可供精确哈希、inventory 与合规回读。"
              echo
              echo "确认无 S1 且 G1、平台 inventory 与成品材料闭环后，将仓库变量临时设为："
              echo
              printf '    %s\n' "$expected"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Public Release blocked::G1/compliance approval does not match this exact release set"
            exit 1
          fi

      - name: Publish one GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/WhaleDock-*.dmg
            release-assets/WhaleDock-*-mac.zip
            release-assets/WhaleDock-Setup-*.exe
            release-assets/WhaleDock-*-portable.exe
            release-assets/SHA256SUMS-mac.txt
            release-assets/SHA256SUMS-win.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## v0.11.0-alpha.1 真机验收版

            这是 v0.11 项目工作台的预发布验收包，不是稳定版。项目成为一等对象，可绑定对话、从控制室查看需要处理的状态，并在三个布局预设的安全窗格中接收 Markdown 与 `widget-result.json` 产物。

            批次 5 增加了项目根目录终端、原生项目皮肤投影、已有项目跨机认领、显式旁车写入、受限产物分离窗，以及控制室最近消息的脱敏摘要。终端由 Host 持有能力令牌并固定到项目根目录与环境白名单；它仍是当前用户权限下的本地 shell，不是操作系统文件系统或网络沙箱。
            本版继续使用鲸坞自己的受管 dsh 目录，`~/.dsh` 不读、不写、不迁移、不清理。真实旧数据升级、真实 Agent 产物回流与五分钟连续手感仍需用户本人完成。
            Windows 仍为实验性支持（未签名、未真机验证）。

            ## macOS 安装

            - macOS 安装包已使用 **Developer ID Application** 正式签名，并通过 Apple 公证；DMG 已附加离线公证票据。
            - 下载与芯片对应的 DMG，把鲸坞拖入 **Applications（应用程序）** 后打开；若系统请求钥匙串授权，由用户本人核对并确认。
            - 如果下载或安装异常，请先按本 Release 的 `SHA256SUMS-mac.txt` 核对文件，勿关闭 Gatekeeper 或移除系统隔离属性。

            ## 重要平台边界

            - 手动启用 dsh SQLite 存储的用户须在升级前备份并保留旧 runtime：`0.1.1-rc.2` 的 opt-in SQLite schema 从 15 升到 17，当前没有迁移路径；鲸坞不会自动迁移、覆盖或清理。默认 JSONL 会话存储不受影响。
            - 受控源码流程与自动化只证明鲸坞自身链路，不等于真实 dsh、上游模型、真实 Agent 回流或 SGD 人工手感验收；v0.11.0-alpha.1 的完整体验仍需用户亲手确认。
            - 飞书源码与成品自动验证不能代替真实平台验收；本版尚未完成真实企业租户、手机收发与人工绑定验证。
            - Windows x64 构建未签名，且为实验性支持，尚未完成 Windows 真机验证；SmartScreen 拦截时可选择“更多信息 → 仍要运行”。CI 通过不代表 Windows dsh/飞书真机已通过。
            - Intel x64 仅在 Apple Silicon + Rosetta 环境抽查，尚未完成 Intel Mac 真机验证。
          prerelease: ${{ contains(github.ref_name, '-') }}
