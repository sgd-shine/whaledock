name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify pinned Node and npm toolchain
        run: node -e "const cp=require('child_process');const npm=cp.spawnSync(process.platform==='win32'?'npm.cmd':'npm',['--version'],{encoding:'utf8',shell:process.platform==='win32'});if(process.version!=='v22.23.2'||npm.status!==0||npm.stdout.trim()!=='10.9.8')throw new Error('Expected Node v22.23.2 / npm 10.9.8, got '+process.version+' / '+npm.stdout.trim())"

      - name: Install dependencies
        run: npm ci

      - name: Verify reproducible dsh UI forks
        run: npm run refork:dsh -- --check

      - name: Verify committed compliance materials
        run: npm run compliance:verify

      - name: Verify committed app runtime compliance materials
        run: npm run app-runtime:verify

      - name: Smoke test
        run: npm run smoke

      # Windows 的 npm .bin/shim 与原生包必须在真实 Windows runner 上留证；
      # 先上传实际清单再做精确 diff，失败时仍可下载 JSON 定位，避免只在 tag 构建才发现漂移。
      - name: Bundle Windows x64 runtime for inventory audit
        if: runner.os == 'Windows'
        run: npm run bundle:dsh -- --platform=win32 --arch=x64

      - name: Generate Windows x64 runtime inventory evidence
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/third-party-inventory.js snapshot --runtime=vendor/dsh-runtime --inventory="$env:RUNNER_TEMP/inventory-win32-x64-actual.json"

      - name: Confirm Windows inventory snapshot was read-only
        if: runner.os == 'Windows'
        run: git diff --exit-code

      - name: Upload Windows x64 runtime inventory evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-inventory-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/inventory-win32-x64-actual.json

      - name: Compare Windows x64 runtime inventory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -e "const c=require('crypto'),f=require('fs');const [expected,actual]=process.argv.slice(1),a=f.readFileSync(expected),b=f.readFileSync(actual),sha=x=>c.createHash('sha256').update(x).digest('hex');if(!a.equals(b)){console.error('Windows inventory byte mismatch expected='+sha(a)+' actual='+sha(b));process.exit(1)};console.log('WINDOWS_INVENTORY_BYTES_VERIFIED '+sha(a))" compliance/inventory-win32-x64.json "$env:RUNNER_TEMP/inventory-win32-x64-actual.json"
